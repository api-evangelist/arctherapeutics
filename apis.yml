name: Arctherapeutics

description: Arctherapeutics develops and provides specialized radiosurgical solutions for the treatment of brain metastases. The company partners
  with hospitals to deliver turnkey systems, including the Zap X radiosurgical unit, and offers comprehensive support ranging from facility design
  to virtual tumor boards. Their mission focuses on innovative management of metastatic brain tumors, integrating multidisciplinary clinical,
  technical, and operational expertise to improve patient outcomes.

